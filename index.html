<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Player Link</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    font-family: sans-serif;
    background-color: #000;
  }
  a {
    font-size: 24px;
    text-decoration: none;
    color: #00f;
    padding: 20px;
    border: 2px solid #00f;
    border-radius: 10px;
    background-color: #111;
  }
</style>
</head>
<body>

<a id="videoLink" href="#" target="_blank">Open Video Player</a>

<script>
  // Fetch the latest tunnel URL from tunnel.txt
  fetch('tunnel.txt')
    .then(res => res.text())
    .then(link => {
      const a = document.getElementById('videoLink');
      a.href = link.trim();

      // Auto-click after 1 second to open video player
      setTimeout(() => {
        a.click();
      }, 1000);
    })
    .catch(err => console.error('Error fetching tunnel.txt:', err));
</script>

</body>
</html>

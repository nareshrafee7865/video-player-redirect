<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Player Launcher</title>
  <style>
    body {
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
      background-color: #111;
      color: #fff;
      text-align: center;
    }
    a {
      color: #0f0;
      text-decoration: none;
      font-size: 1.5rem;
      padding: 10px 20px;
      border: 2px solid #0f0;
      border-radius: 5px;
      transition: all 0.3s ease;
    }
    a:hover {
      background-color: #0f0;
      color: #111;
    }
  </style>
</head>
<body>
  <div id="content">Loading player link...</div>

  <script>
    const txtFile = "link.txt";

    function fetchLink() {
      // Add timestamp to prevent caching
      fetch(txtFile + "?t=" + new Date().getTime())
        .then(res => res.text())
        .then(url => {
          url = url.trim();
          if (url) {
            const container = document.getElementById("content");
            container.innerHTML = `<a href="${url}" target="_blank">Open Video Player</a>`;
            // Optional: auto-redirect to new link
            window.location.href = url;
          } else {
            document.getElementById("content").innerText = "No link found in link.txt";
          }
        })
        .catch(err => {
          console.error(err);
          document.getElementById("content").innerText = "Failed to load link.txt";
        });
    }

    // Initial fetch
    fetchLink();

    // Auto-refresh every 30 seconds
    setInterval(fetchLink, 10000);
  </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Player Wrapper</title>
<style>
  body, html { margin:0; padding:0; height:100%; width:100%; overflow:hidden; }
  iframe { width:100%; height:100%; border:none; }
</style>
</head>
<body>

<iframe id="playerFrame" src="" allow="autoplay; fullscreen"></iframe>

<script>
const iframe = document.getElementById("playerFrame");

// Read the current parent link from your txt file
async function getParentLink() {
  try {
    const res = await fetch("link.txt");
    const text = await res.text();
    return text.trim();
  } catch (e) {
    console.error("Error fetching link.txt:", e);
    return "";
  }
}

// Initialize player
(async () => {
  const link = await getParentLink();
  iframe.src = link;

  // Check if user has clicked overlay before
  const clicked = localStorage.getItem("soundClicked");
  
  if (!clicked) {
    // Wait for first click inside iframe
    window.addEventListener("message", (e) => {
      if (e.data === "soundUnlocked") {
        localStorage.setItem("soundClicked", "true");
      }
    });
  } else {
    // Auto-send message to iframe to trigger overlay click (bypassing)
    iframe.onload = () => {
      iframe.contentWindow.postMessage("autoClickOverlay", "*");
    };
  }
})();
</script>

</body>
</html>

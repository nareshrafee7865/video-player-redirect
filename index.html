<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Player Embed</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background-color: black;
    overflow: hidden;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  #error {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 1.5rem;
    text-align: center;
  }
</style>
</head>
<body>

<div id="error">Loading player...</div>
<iframe id="player" src=""></iframe>

<script>
const txtFile = "link.txt"; // file containing the parent link
const player = document.getElementById("player");
const errorDiv = document.getElementById("error");

function loadIframe() {
  fetch(txtFile + "?t=" + new Date().getTime()) // prevent caching
    .then(res => res.text())
    .then(url => {
      url = url.trim();
      if(url) {
        player.src = url;
        errorDiv.style.display = "none";
        // Attempt fullscreen after iframe loads
        player.onload = () => {
          if(player.requestFullscreen) {
            player.requestFullscreen().catch(err => console.log("Fullscreen error:", err));
          } else if(player.webkitRequestFullscreen) { // Safari
            player.webkitRequestFullscreen();
          } else if(player.msRequestFullscreen) { // IE/Edge
            player.msRequestFullscreen();
          }
        };
      } else {
        errorDiv.innerText = "No link found in link.txt";
        errorDiv.style.display = "block";
      }
    })
    .catch(err => {
      console.error("Failed to fetch link.txt:", err);
      errorDiv.innerText = "Failed to load link.txt";
      errorDiv.style.display = "block";
    });
}

// Initial load
loadIframe();

// Refresh every 30 seconds to get updated link
setInterval(loadIframe, 30000);
</script>

</body>
</html>

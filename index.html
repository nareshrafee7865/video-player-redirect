<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Player Embed</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    background-color: black;
    overflow: hidden;
    cursor: pointer;
  }
  #player {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    border: none;
  }
  #clickOverlay {
    position: absolute;
    width: 100%;
    height: 100%;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
    font-size: 2rem;
    background: rgba(0,0,0,0.5);
    z-index: 2;
  }
  #watermark {
    position: absolute;
    bottom: 10px;
    right: 10px;
    width: 80px; /* minimal size */
    opacity: 0.6;
    z-index: 3;
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="clickOverlay">Click anywhere to play</div>

<iframe id="player" src=""></iframe>

<img id="watermark" src="logo.png" alt="Logo">

<script>
const txtFile = "link.txt"; // contains parent URL
const player = document.getElementById("player");
const overlay = document.getElementById("clickOverlay");

// Load the link into iframe
function loadIframe() {
  fetch(txtFile + "?t=" + new Date().getTime())
    .then(res => res.text())
    .then(url => {
      url = url.trim();
      if(url) {
        player.src = url;
      } else {
        console.error("No link found in link.txt");
      }
    })
    .catch(err => console.error("Failed to fetch link.txt:", err));
}

// Handle click to hide overlay and request fullscreen
document.body.addEventListener("click", () => {
  overlay.style.display = "none"; // hide the click overlay

  // Try to request fullscreen
  if(player.requestFullscreen) {
    player.requestFullscreen().catch(err => console.log("Fullscreen error:", err));
  } else if(player.webkitRequestFullscreen) {
    player.webkitRequestFullscreen();
  } else if(player.msRequestFullscreen) {
    player.msRequestFullscreen();
  }
});

// Initial load
loadIframe();
setInterval(loadIframe, 30000); // refresh every 30 sec
</script>

</body>
</html>

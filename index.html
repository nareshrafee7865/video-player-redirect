<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Player Wrapper</title>
<style>
  body, html { margin:0; padding:0; height:100%; width:100%; overflow:hidden; }
  iframe { width:100%; height:100%; border:none; }
</style>
</head>
<body>

<iframe id="playerFrame" src="" allow="autoplay; fullscreen"></iframe>

<script>
const iframe = document.getElementById("playerFrame");
const STORAGE_KEY = "soundClicked";

// Function to fetch parent link from link.txt
async function getParentLink() {
  try {
    const res = await fetch("link.txt?" + Date.now()); // prevent cache
    return (await res.text()).trim();
  } catch (e) {
    console.error("Error fetching link.txt:", e);
    return "";
  }
}

// Load iframe and auto-click overlay if needed
async function loadPlayer() {
  const link = await getParentLink();
  if (!link) return;

  iframe.src = link;

  // Once iframe is loaded
  iframe.onload = () => {
    const clicked = localStorage.getItem(STORAGE_KEY);

    if (!clicked) {
      // Listen for overlay click from inside iframe
      window.addEventListener("message", function msgHandler(e) {
        if (e.data === "soundUnlocked") {
          localStorage.setItem(STORAGE_KEY, "true");
          window.removeEventListener("message", msgHandler);
        }
      });
    } else {
      // Automatically trigger overlay click inside iframe
      iframe.contentWindow.postMessage("autoClickOverlay", "*");
    }
  };
}

// Initial load
loadPlayer();

// Poll link.txt every 30s and reload iframe if changed
let lastLink = "";
setInterval(async () => {
  const newLink = await getParentLink();
  if (newLink && newLink !== lastLink) {
    lastLink = newLink;
    loadPlayer();
  }
}, 30000);

</script>
</body>
</html>

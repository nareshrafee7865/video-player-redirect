<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Media Player</title>
<style>
html, body { margin:0; padding:0; height:100%; background:black; overflow:hidden; }
video, img {
  position:absolute; top:0; left:0;
  width:100%; height:100%;
  object-fit:cover;
}
video { display:block; }
img { display:none; }

/* Watermark logo */
#watermark {
  position: fixed;
  bottom: 10px;
  right: 10px;
  width: 80px;
  height: 80px;
  opacity: 0.4;
  z-index: 999;
  pointer-events: none;
}
</style>
</head>
<body>
<video id="player" autoplay playsinline></video>
<img id="image" />
<img id="watermark" src="/media/logo.png" />
<script src="script.js"></script>
</body>
</html>

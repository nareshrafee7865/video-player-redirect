<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Video Player</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: black;
    width: 100%;
    height: 100%;
    overflow: hidden;
  }
  video, img {
    position: fixed;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: contain;
    background: black;
  }
</style>
</head>
<body>

<video id="player" playsinline></video>
<img id="image" style="display:none;" />

<script>
const video = document.getElementById("player");
const image = document.getElementById("image");

let playlist = [];
let current = 0;
let soundUnlocked = false;

// One-time overlay to unlock sound
let overlayShown = false;
function createOverlay() {
  if (overlayShown) return;
  overlayShown = true;

  const overlay = document.createElement("div");
  overlay.style.position = "fixed";
  overlay.style.top = 0;
  overlay.style.left = 0;
  overlay.style.width = "100%";
  overlay.style.height = "100%";
  overlay.style.background = "rgba(0,0,0,0.7)";
  overlay.style.color = "white";
  overlay.style.display = "flex";
  overlay.style.alignItems = "center";
  overlay.style.justifyContent = "center";
  overlay.style.fontSize = "26px";
  overlay.style.cursor = "pointer";
  overlay.style.zIndex = 1000;
  overlay.innerText = "Tap anywhere to enable sound & fullscreen";
  document.body.appendChild(overlay);

  overlay.addEventListener("click", async () => {
    soundUnlocked = true;
    video.muted = false;
    overlay.remove();
    try { 
      await video.play(); 
      if (video.requestFullscreen) video.requestFullscreen();
    } catch(e){console.warn("Autoplay failed:", e);}
  });
}

// Fetch playlist from your server
async function fetchPlaylist() {
  try {
    const res = await fetch("/playlist");
    playlist = await res.json();
  } catch(err){
    console.error("Error fetching playlist:", err);
  }
}

// Play next media
function playNext() {
  if (!playlist.length) return;
  const item = playlist[current];

  if (item.type === "video") {
    image.style.display = "none";
    video.style.display = "block";
    video.src = `/media/${item.file}`;
    video.muted = !soundUnlocked;
    video.load();
    video.play().catch(err=>console.warn("Autoplay failed:",err));
    video.onended = () => {
      current = (current + 1) % playlist.length;
      playNext();
    };
  } else if(item.type === "image") {
    video.pause();
    video.style.display = "none";
    image.src = `/media/${item.file}`;
    image.style.display = "block";
    setTimeout(() => {
      current = (current + 1) % playlist.length;
      playNext();
    }, 5000);
  }
}

// Auto-refresh playlist every 30s
setInterval(fetchPlaylist, 30000);

// Initialize
(async () => {
  createOverlay();
  await fetchPlaylist();
  if (playlist.length) playNext();
})();
</script>

</body>
</html>

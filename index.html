<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Player</title>
  <style>
    body, html {
      margin: 0;
      padding: 0;
      height: 100%;
      width: 100%;
      background-color: black;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
  </style>
</head>
<body>
  <video id="player" autoplay muted playsinline></video>

  <script>
    const txtFile = "link.txt"; // GitHub repo root file with media URL

    const player = document.getElementById("player");

    function loadVideo() {
      fetch(txtFile + "?t=" + new Date().getTime()) // cache-busting
        .then(res => res.text())
        .then(url => {
          url = url.trim();
          if (url) {
            if (player.src !== url) {
              player.src = url;
              player.play().catch(err => console.log("Autoplay prevented:", err));
            }
          } else {
            console.error("No URL found in link.txt");
          }
        })
        .catch(err => console.error("Failed to fetch link.txt:", err));
    }

    // Load initially
    loadVideo();

    // Refresh the link every 30 seconds
    setInterval(loadVideo, 30000);
  </script>
</body>
</html>

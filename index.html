<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Player Embed</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background-color: black;
    display: flex;
    justify-content: center;
    align-items: center;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  #error {
    position: absolute;
    color: white;
    font-size: 1.5rem;
    text-align: center;
  }
</style>
</head>
<body>

<div id="error">Loading player...</div>
<iframe id="player" src=""></iframe>

<script>
const txtFile = "link.txt"; // file containing the parent link
const player = document.getElementById("player");
const errorDiv = document.getElementById("error");

function loadIframe() {
  fetch(txtFile + "?t=" + new Date().getTime()) // cache-busting
    .then(res => res.text())
    .then(url => {
      url = url.trim();
      if(url) {
        player.src = url;
        errorDiv.style.display = "none"; // hide error once loaded
      } else {
        errorDiv.innerText = "No link found in link.txt";
        errorDiv.style.display = "block";
      }
    })
    .catch(err => {
      console.error("Failed to fetch link.txt:", err);
      errorDiv.innerText = "Failed to load link.txt";
      errorDiv.style.display = "block";
    });
}

// Load iframe initially
loadIframe();

// Refresh every 30 seconds to get updated parent link
setInterval(loadIframe, 30000);
</script>

</body>
</html>

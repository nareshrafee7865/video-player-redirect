<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Player Wrapper</title>
<style>
  html, body { margin:0; padding:0; width:100%; height:100%; overflow:hidden; }
  iframe { width:100%; height:100%; border:none; }
</style>
</head>
<body>

<iframe id="playerFrame" src="" allow="autoplay; fullscreen"></iframe>

<script>
const iframe = document.getElementById("playerFrame");
const STORAGE_KEY = "soundClicked";
let lastLink = "";

// Function to fetch link.txt from same folder
async function getParentLink() {
  try {
    const res = await fetch("link.txt?" + Date.now()); // prevent cache
    return (await res.text()).trim();
  } catch (e) {
    console.error("Error fetching link.txt:", e);
    return "";
  }
}

// Load iframe and handle overlay logic
async function loadPlayer() {
  const link = await getParentLink();
  if (!link) return;

  // Only reload if link changed
  if (link === lastLink) return;
  lastLink = link;

  iframe.src = link;

  iframe.onload = () => {
    const clicked = localStorage.getItem(STORAGE_KEY);

    if (!clicked) {
      // Listen for overlay click from iframe
      window.addEventListener("message", function msgHandler(e) {
        if (e.data === "soundUnlocked") {
          localStorage.setItem(STORAGE_KEY, "true");
          window.removeEventListener("message", msgHandler);
        }
      });
    } else {
      // Auto click overlay in iframe
      iframe.contentWindow.postMessage("autoClickOverlay", "*");
    }
  };
}

// Initial load
loadPlayer();

// Auto-refresh every 30s to check for new link
setInterval(loadPlayer, 30000);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Video Player Embed</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    width: 100%;
    background-color: black;
    overflow: hidden;
    display: flex;
    justify-content: center;
    align-items: center;
    cursor: pointer;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: none;
  }
  #clickMessage {
    position: absolute;
    color: white;
    font-size: 1.5rem;
    text-align: center;
    pointer-events: none;
  }
</style>
</head>
<body>
<div id="clickMessage"></div>
<iframe id="player" src=""></iframe>

<script>
const txtFile = "link.txt"; // file containing parent link
const player = document.getElementById("player");
const clickMessage = document.getElementById("clickMessage");

// Load the parent link into iframe
function loadIframe() {
  fetch(txtFile + "?t=" + new Date().getTime())
    .then(res => res.text())
    .then(url => {
      url = url.trim();
      if(url) {
        player.src = url;
      } else {
        console.error("No link found in link.txt");
      }
    })
    .catch(err => console.error("Failed to fetch link.txt:", err));
}

// Fullscreen on first click
function requestFullscreen() {
  if(player.requestFullscreen) {
    player.requestFullscreen();
  } else if(player.webkitRequestFullscreen) { // Safari
    player.webkitRequestFullscreen();
  } else if(player.msRequestFullscreen) { // IE/Edge
    player.msRequestFullscreen();
  }
  clickMessage.style.display = "none"; // hide message after click
}

// Add click listener
document.body.addEventListener("click", () => {
  requestFullscreen();
});

// Initial load
loadIframe();

// Refresh every 30 seconds in case link changes
setInterval(loadIframe, 30000);
</script>
</body>
</html>
